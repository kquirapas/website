[workspace]
resolver = "3"

members = [
	"app",
	"api/blog",
	"api/data",
	"cli",
]

[workspace.dependencies]
anyhow = "1.0.81"
askama = "0.12.1"
axum = "0.7.5"
chrono = "0.4.44"
clap = { version = "4.5.9", features = ["cargo"] }
directories = "6.0.0"
dotenvy = "0.15.7"
serde = "1.0.228"
sqlx = { version = "0.8.6", features = ["sqlite"] }
thiserror = "2.0.18"
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread", "full"] }
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["fs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

website-app = { version = "0.1.0", path = "app" }
website-api-blog = { version = "0.1.0", path = "api/blog" }
website-api-data = { version = "0.1.0", path = "api/data" }
website-cli = { version = "0.1.0", path = "cli" }
